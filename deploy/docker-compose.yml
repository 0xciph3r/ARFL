# ARFL Testnet — Hub + Entry Node + Exit Node + Nostr Relay
#
# Usage:
#   cd deploy
#   ./init-testnet.sh        # generate keys & configs (run once)
#   docker compose up --build
#
# The hub runs in --dev mode (mock Lightning). For real LND, set
# ARFL_LND_* env vars or update data/hub/hub.json.

services:
  # --- Nostr Relay ---
  # Lightweight relay for node announcements (kind 30078).
  relay:
    image: scsibug/nostr-rs-relay:0.9.0
    ports:
      - "7777:8080"
    environment:
      - RUST_LOG=warn
    networks:
      - arfl

  # --- Hub ---
  # Discovery API + payment + blind signature issuance.
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
      target: hub
    command: ["--config", "/data/hub.json", "--dev"]
    volumes:
      - ./data/hub:/data
    ports:
      - "8080:8080"
    depends_on:
      - relay
    restart: unless-stopped
    networks:
      - arfl

  # --- Entry Node ---
  entry-node:
    build:
      context: ..
      dockerfile: Dockerfile
      target: node
    command: ["--config", "/data/node.json"]
    volumes:
      - ./data/entry:/data
    cap_add:
      - NET_ADMIN      # WireGuard interface management
      - NET_RAW         # raw sockets for nftables
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "51820:51820/udp"
      - "9091:9091"
    depends_on:
      - hub
      - relay
    restart: unless-stopped
    networks:
      - arfl

  # --- Exit Node ---
  exit-node:
    build:
      context: ..
      dockerfile: Dockerfile
      target: node
    command: ["--config", "/data/node.json"]
    volumes:
      - ./data/exit:/data
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "51821:51821/udp"
      - "9092:9091"
    depends_on:
      - hub
      - relay
    restart: unless-stopped
    networks:
      - arfl

networks:
  arfl:
    driver: bridge
